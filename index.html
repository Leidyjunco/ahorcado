<style>
:root{--bg:#000;--fg:#f2f2f2;--muted:rgba(242,242,242,.62);--line:rgba(242,242,242,.3);--faint:rgba(242,242,242,.12);
  --ui:"Albert Sans","Helvetica Neue",Arial,sans-serif;--display:"Anton",Impact,"Arial Narrow",sans-serif;--hand:"Covered By Your Grace","Comic Sans MS",cursive;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--ui);-webkit-font-smoothing:antialiased;overflow:hidden;
  padding:env(safe-area-inset-top,0) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0) max(16px,env(safe-area-inset-left,0px))}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
a{color:var(--fg)}
.glow{position:fixed;border-radius:50%;pointer-events:none;z-index:0;background:radial-gradient(circle,rgba(255,255,255,.11),rgba(255,255,255,0) 70%)}
.star{position:fixed;border-radius:50%;background:rgba(255,255,255,.6);pointer-events:none;z-index:0}
#app{position:relative;z-index:1;height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;padding-block:14px 18px}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;overflow-y:auto;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;flex:none}
.label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ring{width:44px;height:44px;flex:none;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center}
.ring svg{width:18px;height:18px}
.pill{min-height:56px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;padding:0 20px;text-decoration:none;text-align:center;flex:none}
.solid{background:var(--fg);color:#000;font-weight:500}
.ghost{border:1.5px solid var(--line)}
.solid[disabled]{opacity:.35;cursor:default}
.link{align-self:center;padding:10px 14px;font-size:15px;color:var(--muted)}
.chip{padding:10px 16px;border-radius:999px;border:1.5px solid var(--line);font-size:15px}
.chip[aria-pressed="true"],.opt[aria-pressed="true"]{background:var(--fg);color:#000;border-color:var(--fg)}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;border-radius:18px;border:1.5px solid var(--line);text-align:left}
.opt small{font-size:12.5px;opacity:.72}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.wordmark{font-family:var(--display);font-weight:400;line-height:.95;margin:0;text-align:center;white-space:nowrap;letter-spacing:-.5px}
.slant{display:inline-block;transform:skewX(-14deg)}
.display{font-family:var(--display);font-weight:400;margin:0;line-height:.95}
.hand{font-family:var(--hand)}
.field{display:flex;flex-direction:column;gap:8px}
.input{height:56px;border-radius:18px;border:1.5px solid var(--line);background:none;padding:0 18px;font-size:18px;width:100%}
.input::placeholder{color:rgba(242,242,242,.4)}
.faces{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.facebtn{aspect-ratio:1;border-radius:22px;border:1.5px solid var(--faint);display:grid;place-items:center}
.facebtn[aria-pressed="true"]{border-color:var(--fg);background:rgba(255,255,255,.08)}
.facebtn svg{width:80%;height:80%}
.players{display:flex;flex-direction:column}
.prow{display:flex;align-items:center;gap:14px;padding:10px 0;border-top:1px solid var(--faint)}
.prow svg{width:46px;height:46px;flex:none}
.prow .nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.prow .nm b{font-weight:400;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .nm span{font-size:13px;color:var(--muted)}
.tag{padding:6px 12px;border-radius:999px;font-size:13px;white-space:nowrap}
.tag.on{background:var(--fg);color:#000}
.tag.off{border:1.5px dashed rgba(242,242,242,.35);color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tags span{padding:6px 12px;border-radius:999px;border:1px solid rgba(242,242,242,.22);font-size:13px;color:rgba(242,242,242,.85)}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;flex:none}
.sc{display:flex;flex-direction:column;align-items:center;padding:7px 4px;border-radius:16px;border:1.5px solid rgba(242,242,242,.25);min-width:0}
.sc.me{background:var(--fg);color:#000;border-color:var(--fg)}
.sc.away{opacity:.4}
.sc span{font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc b{font-family:var(--display);font-weight:400;font-size:21px;line-height:1.1;font-variant-numeric:tabular-nums}
.sc i{font-style:normal;font-size:11px;opacity:.75}
.stage{flex:1;min-height:150px;position:relative;display:flex;align-items:center;justify-content:center}
.stage svg{width:min(270px,100%);height:100%;max-height:276px}
.remark{position:absolute;left:4px;top:18px;transform:rotate(-7deg);font-family:var(--hand);font-size:24px;line-height:1}
.clue{font-size:22px;font-weight:300;text-align:center;letter-spacing:-.01em;text-wrap:balance}
.slots{display:flex;justify-content:center;align-items:flex-end;flex-wrap:wrap;gap:8px 4px;min-height:46px}
.word{display:flex;gap:4px;flex-wrap:nowrap}
.slot{width:24px;height:40px;border-bottom:2px solid rgba(242,242,242,.38);display:grid;place-items:center;font-size:26px;font-weight:300;line-height:1}
.slot.p{border-color:transparent;width:auto;min-width:8px;color:var(--muted)}
.slot.miss{color:rgba(242,242,242,.42)}
.gap{width:12px}
.feed{align-self:center;font-size:13px;color:var(--muted);text-align:center;min-height:17px}
.kb{display:flex;flex-direction:column;gap:6px;flex:none}
.kb div{display:flex;gap:5px;justify-content:center}
.key{flex:0 1 34px;height:46px;border-radius:11px;border:1.5px solid var(--line);font-size:17px;text-align:center;padding:0}
.key.hit{background:var(--fg);color:#000;border-color:var(--fg)}
.key.miss{color:rgba(242,242,242,.35);border:1.5px dashed rgba(242,242,242,.22);text-decoration:line-through}
.key[disabled]:not(.hit):not(.miss){opacity:.35}
.banner{align-self:center;padding:8px 14px;border-radius:999px;font-size:14px;border:1.5px solid var(--line)}
.banner.mine{background:var(--fg);color:#000;border-color:var(--fg)}
.tags span span{border:0;padding:0;font-size:inherit;color:inherit}
.rows .r{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--faint)}
.rows .rk{font-family:var(--display);font-size:20px;width:22px;color:rgba(242,242,242,.5)}
.rows .who{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rows .who b{font-weight:400;font-size:16px}
.rows .who span{font-size:12px;color:var(--muted)}
.rows .tot{font-family:var(--display);font-size:22px;min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end}
.pcol{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.pcol .nm{font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pblock{width:100%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1.5px solid rgba(242,242,242,.35)}
.pblock.first{background:var(--fg);color:#000;border-color:var(--fg)}
.pblock b{font-family:var(--display);font-weight:400;line-height:1}
.pblock span{font-size:13px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:#000;padding:10px 16px;border-radius:999px;font-size:14px;z-index:10}
.err{color:var(--fg);border:1.5px dashed var(--line);border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.4}
@keyframes bounce{0%{transform:scale(.9)}100%{transform:scale(1)}}
.bounce{animation:bounce .45s cubic-bezier(.3,1.6,.5,1)}
@media (prefers-reduced-motion:reduce){.bounce{animation:none}}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;flex:none}
.mcard{display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:14px;border-radius:22px;border:1.5px solid var(--faint);text-align:left;background:linear-gradient(180deg,#151515,#0a0a0a);min-width:0}
.mcard b{font-family:var(--display);font-weight:400;font-size:25px;line-height:1;letter-spacing:.3px}
.mcard span{font-size:13px;color:var(--muted);line-height:1.3}
.installbar{display:flex;align-items:center;border:1.5px dashed var(--line);border-radius:18px;flex:none}
.installbar [data-install]{flex:1;display:flex;align-items:center;gap:12px;padding:10px 14px;text-align:left}
.installbar span{display:flex;flex-direction:column;gap:1px}.installbar b{font-weight:500;font-size:15px}.installbar small{font-size:12px;color:var(--muted)}
.installbar [data-hideinstall]{width:44px;height:44px;font-size:22px;color:var(--muted)}
.mcard.live{background:var(--fg);color:#000;border-color:var(--fg)}
.mcard.live span{color:rgba(0,0,0,.66)}
.mine{display:flex;flex-direction:column;flex:none}
.mine button{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 2px;border-top:1px solid var(--faint);text-align:left;font-size:15px}
.mine button span:last-child{color:var(--muted);font-size:13px;white-space:nowrap}
.lb .r svg{width:34px;height:34px;flex:none}
.sq{letter-spacing:2px;font-size:12px}
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;flex:none}
.vs .p{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.vs .p svg{width:68px;height:68px}
.vs .p b{font-family:var(--display);font-weight:400;font-size:34px;line-height:1}
.vs .p span{font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{border:1.5px solid var(--faint);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;flex:none}
.note p{margin:0;line-height:1.45}
.hist .r{align-items:flex-start}
@media (max-height:700px){.stage svg{max-height:200px}}
</style>
</head>

<script>
/* ===================== config ===================== */
const SUPA_URL = 'https://nxvwegqmxaiqshlnoear.supabase.co';
const SUPA_KEY = 'sb_publishable_ysKjQTXnzZVVEO9EycsRhQ_Rn1YiALW';
const params = new URLSearchParams(location.search);
const LOCAL = params.has('local');            // offline test mode: tabs talk over BroadcastChannel
const LEVELS = [['Fácil','Palabras comunes'],['Medio','Vocabulario variado'],['Difícil','Menos intentos']];
const KINDS = [['palabra','Una palabra','Una sola palabra: el pan, feliz, viajar.'],['varias','Varias palabras','Expresiones cortas: buenos días, todo recto.'],['frase','Frases','Frases enteras: ¿Dónde está el baño?']];
const MODES = [['carrera','Carrera','Todos adivinan la misma palabra a la vez. Gana quien termina primero.'],['turnos','Por turnos','Una letra por jugador, por turnos. Cada acierto suma puntos.'],['elige','Uno elige','Un jugador escribe la palabra y los demás adivinan. Se rota.']];
const BASE_TRIES = [8,6,5];
const DUR = {palabra:90e3, varias:120e3, frase:150e3};
const TURN_MS = 20e3, NEXT_MS = 9e3, SET_MS = 60e3;
const CODE_WORDS = ['TACO','LUNA','PERA','GATO','SOPA','MANGO','FLOR','PATO','NUBE','MAR','SOL','LIMA','COCO','OSO','RANA','TORO','FARO','ROSA','MIEL','PAN'];

/* ===================== helpers ===================== */
const $ = (s, el=document) => el.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const base = c => { c = c.toLowerCase(); return c === 'ñ' ? 'ñ' : c.normalize('NFD').replace(/[̀-ͯ]/g,''); };
const isLetter = c => /[a-zñáéíóúü]/i.test(c);
const lettersOf = s => new Set([...s].filter(isLetter).map(base));
const occ = (s,k) => [...s].filter(c => isLetter(c) && base(c) === k).length;
const rnd = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const uid = () => Math.random().toString(36).slice(2,10);
const store = { get(k,d){ try{ const v = localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
const fmtCode = c => c.replace(/^([A-Z]+)(\d+)$/, '$1·$2');
const normCode = c => (c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function toast(t){ const el=$('#toast'); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2200); }

// one player per browser tab (so two tabs can play each other); name and face are remembered
let myId; try { myId = sessionStorage.getItem('ahorcado-id'); if(!myId){ myId = uid(); sessionStorage.setItem('ahorcado-id', myId); } } catch(e){ myId = uid(); }
const me = { id: myId, name: store.get('ahorcado-name',''), face: store.get('ahorcado-face',0), joinedAt: 0 };

/* ===================== drawings ===================== */
const FACES = [
  {head:'M30 22h40c10 0 14 4 14 14v32c0 10-4 14-14 14H30c-10 0-14-4-14-14V36c0-10 4-14 14-14z', acc:'M28 24c6-12 40-13 46-1M51 12v-6'},
  {head:'M50 18c20 0 32 14 32 34s-12 34-32 34-32-14-32-34 12-34 32-34z', acc:'M48 18c-2-7 5-11 8-6 2 3-2 6-3 3'},
  {head:'M50 20c12 0 15 11 14 19 16 6 21 21 15 31-6 11-52 11-58 0-6-10-1-25 15-31-1-8 2-19 14-19z', acc:'M50 20c0-6 2-9 6-11M53 12c4-2 9-1 11 2-5 2-9 1-11-2z'},
  {head:'M30 26c14-10 42-8 50 10 8 16 0 42-22 46-22 4-42-8-43-26-1-12 5-22 15-30z', acc:'M38 30l-3-7M48 26l-1-7M58 26l2-7'}
];
function avatar(i, mood='neutral'){
  const f = FACES[(i|0) % FACES.length];
  const mouth = mood==='happy' ? 'M41 66q9 10 18 0' : mood==='sad' ? 'M42 70q8-7 16 0' : mood==='oops' ? 'M50 68m-3 0a3 4 0 106 0a3 4 0 10-6 0' : 'M43 67q7 4 14 0';
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke="#f2f2f2" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#ink2)"><path d="${f.head}" fill="#000"/><path d="${f.acc}"/><path d="M51 50c-3 7-4 10 2 12"/><path d="${mouth}"/></g><circle cx="41" cy="53" r="3" fill="#f2f2f2"/><circle cx="60" cy="52" r="2.5" fill="#f2f2f2"/></svg>`;
}
// Shrigley-style hangman; parts = how many of the 6 body parts are drawn (ghost dashes for the rest when ghost=true)
function hangman(parts, mood='neutral', ghost=true, label=''){
  const P = [
    ['M162 50 C187 49 191 73 186 87 C181 101 146 103 140 87 C134 71 141 50 162 50 Z',3.8],
    ['M162 102 C160 126 165 146 161 169',3.6],
    ['M161 117 C150 125 142 135 133 147 M133 147 l-6 3 M133 147 l-2 7 M133 147 l4 5',3.2],
    ['M162 117 C172 126 180 133 189 142 M189 142 l7 1 M189 142 l4 6 M189 142 l0 7',3.2],
    ['M161 169 C157 181 152 191 147 201 l-10 1',3.4],
    ['M161 169 C165 181 170 191 175 202 l10 -1',3.4]];
  const body = P.map(([d,w],i) => i < parts ? `<path d="${d}" stroke="#f2f2f2" stroke-width="${w}"/>` : ghost ? `<path d="${d}" stroke="rgba(242,242,242,.22)" stroke-width="${w}" stroke-dasharray="3 9"/>` : '').join('');
  const face = parts >= 1 ? `<path d="${mood==='happy'?'M153 86 C158 93 166 93 171 85':mood==='sad'?'M154 93 C160 86 166 86 171 92':'M155 89 C160 88 166 90 170 88'}" stroke="#f2f2f2" stroke-width="3"/>` : '';
  const eyes = parts >= 1 ? `<circle cx="153" cy="61" r="3.4" fill="#f2f2f2"/><circle cx="171" cy="59" r="2.8" fill="#f2f2f2"/>` : '';
  return `<svg viewBox="0 0 240 245" role="img" aria-label="${esc(label||'Dibujo del ahorcado')}">
    <g fill="none" stroke="#f2f2f2" stroke-linecap="round" stroke-linejoin="round" filter="url(#ink)">
      <path d="M20 232 C50 229 90 235 138 230" stroke-width="4.5"/><path d="M60 231 C58 170 63 110 57 24" stroke-width="4.5"/>
      <path d="M55 26 C90 21 128 28 164 23" stroke-width="4"/><path d="M59 64 C71 51 84 38 95 25" stroke-width="3.5"/>
      <path d="M161 24 C163 29 159 34 162 39" stroke-width="3"/></g>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#ink)" transform="translate(0 -12)">${body}${face}</g>${eyes}</svg>`;
}
const ICON = {
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>',
  copy:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="3"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2"/></svg>',
  share:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M8 8l4-4 4 4"/><path d="M5 12v6a2 2 0 002 2h10a2 2 0 002-2v-6"/></svg>',
  clock:'<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="rgba(242,242,242,.3)" stroke-width="2"/><path d="M12 6v6l4 2" fill="none" stroke="#f2f2f2" stroke-width="2" stroke-linecap="round"/></svg>'
};
// background stars
document.getElementById('stars').innerHTML = Array.from({length:22},()=>`<div class="star" style="left:${Math.random()*100}vw;top:${Math.random()*100}vh;width:${1+Math.random()*1.4}px;height:${1+Math.random()*1.4}px"></div>`).join('');

/* ===================== networking ===================== */
// A room is a realtime channel: presence lists who is here; broadcast carries game state and moves.
let supa = null;
function makeNet(code, h){
  if (code === 'SOLO'){ setTimeout(()=>{ h.status('ok'); h.peers([meta()]); }); return { send(){}, leave(){}, retrack(){} }; }
  if (LOCAL){
    const bc = new BroadcastChannel('ahorcado-'+code), peers = new Map();
    const hello = () => bc.postMessage({k:'p', meta:meta()});
    const emit = () => h.peers([meta(), ...peers.values()]);
    bc.onmessage = e => { const d = e.data;
      if (d.k === 'p'){ const old = peers.get(d.meta.id); peers.set(d.meta.id, {...d.meta, seen:Date.now()});
        if (!old){ hello(); emit(); } else if (old.name !== d.meta.name || old.face !== d.meta.face) emit(); }
      else if (d.k === 'bye'){ peers.delete(d.id); emit(); }
      else if (d.k === 'm') h.msg(d.p); };
    const t = setInterval(()=>{ hello(); let ch=false; for (const [id,p] of peers) if (Date.now()-p.seen>3500){ peers.delete(id); ch=true; } if(ch) emit(); }, 1000);
    setTimeout(()=>{ hello(); h.status('ok'); emit(); }, 50);
    return { send:p => bc.postMessage({k:'m', p}), leave(){ clearInterval(t); bc.postMessage({k:'bye', id:me.id}); bc.close(); }, retrack: hello };
  }
  if (!window.supabase){ setTimeout(()=>h.status('error')); return { send(){}, leave(){}, retrack(){} }; }
  supa = supa || window.supabase.createClient(SUPA_URL, SUPA_KEY, { realtime:{ params:{ eventsPerSecond: 20 } } });
  const ch = supa.channel('ahorcado-'+code, { config:{ broadcast:{ self:false }, presence:{ key: me.id } } });
  ch.on('broadcast', {event:'m'}, ({payload}) => h.msg(payload));
  ch.on('presence', {event:'sync'}, () => { const st = ch.presenceState(); h.peers(Object.values(st).map(a => a[a.length-1])); });
  ch.subscribe(async s => {
    if (s === 'SUBSCRIBED'){ await ch.track(meta()); h.status('ok'); }
    else if (s === 'CHANNEL_ERROR' || s === 'TIMED_OUT') h.status('error');
  });
  return { send:p => ch.send({type:'broadcast', event:'m', payload:p}), leave(){ supa.removeChannel(ch); }, retrack(){ ch.track(meta()); } };
}
const meta = () => ({ id:me.id, name:me.name, face:me.face, joinedAt:me.joinedAt });

/* ===================== app state ===================== */
const R = { view:'home', code:null, net:null, status:'idle', peers:[], S:null, setup:null, solo:false, pendingJoin:null };
const hostId = () => R.peers[0]?.id;
const isHost = () => hostId() === me.id;
const present = id => R.peers.some(p => p.id === id);
const nameOf = id => (R.S?.roster.find(p=>p.id===id)?.name) || (R.peers.find(p=>p.id===id)?.name) || 'Alguien';
const triesOf = st => BASE_TRIES[st.level] + (st.kind === 'frase' ? 2 : st.kind === 'varias' ? 1 : 0);

function enterRoom(code, setup){
  leaveRoom(true);
  Object.assign(R, { code, setup, S:null, peers:[], status:'connecting', view:'room', solo: code==='SOLO' });
  me.joinedAt = Date.now();

  R.net = makeNet(code, {
    status: s => { R.status = s; render(); },
    peers: list => { R.peers = list.filter(p=>p&&p.id).sort((a,b)=> (a.joinedAt-b.joinedAt) || (a.id<b.id?-1:1)); onPeers(); },
    msg: onMsg

}
function leaveRoom(silent){

  history.replaceState(null, '', location.pathname + (LOCAL ? '?local' : ''));
  if (!silent){ R.view = 'home'; render(); }
}
function onPeers(){
  if (isHost()){
    if (!R.S) R.S = newState(R.setup || {level:1, kind:'varias', mode:'carrera', rounds:10});
    syncRoster();
    if (R.solo && R.S.phase === 'lobby'){ startGame(); return; }
    commit();
  }
  render();
}
function syncRoster(){
  const S = R.S;
  for (const p of R.peers){
    const r = S.roster.find(x => x.id === p.id);
    if (r){ r.name = p.name; r.face = p.face; } else { S.roster.push({id:p.id, name:p.name, face:p.face}); S.scores[p.id] = S.scores[p.id] || 0; }
  }
  if (S.phase === 'lobby') S.roster = S.roster.filter(r => present(r.id));
}
function onMsg(m){
  if (!m) return;
  if (m.t === 'state'){
    // only the room's host (longest-present player) is trusted to describe the game
    if (isHost() || m.from !== hostId()) return;
    if (!R.S || m.S.gid !== R.S.gid || m.S.v >= R.S.v){ R.S = m.S; render(); }
  } else if (m.t === 'act' && isHost()){ apply(m.a, m.id); }
  else if (m.t === 'need' && isHost()){ commit(); }
}
function commit(){ if (!R.S) return; R.S.v++; R.net && R.net.send({t:'state', S:R.S, from:me.id}); render(); }
function act(a){ if (isHost()) apply(a, me.id); else R.net && R.net.send({t:'act', a, id:me.id}); }

/* ===================== game rules (run by the host) ===================== */
function newState(setup){ return { gid:uid(), v:0, phase:'lobby', settings:setup, round:0, roster:[], scores:{}, gains:{}, used:[], item:null, setterId:null, race:null, turn:null, endsAt:0, nextAt:0, firstSolver:null }; }
function activeIds(){ return R.S.roster.filter(r => present(r.id)).map(r => r.id); }
function pickItem(){
  const {kind, level} = R.S.settings; const list = BANK[kind][level];
  let pool = list.filter(x => !R.S.used.includes(x[0])); if (!pool.length){ R.S.used = []; pool = list; }
  const it = rnd(pool); R.S.used.push(it[0]); return it;
}
function gain(id, pts, why){ if (!pts) return; const g = R.S.gains[id] = R.S.gains[id] || {pts:0, why:{}}; g.pts += pts; g.why[why] = (g.why[why]||0) + pts; R.S.scores[id] = (R.S.scores[id]||0) + pts; }
function startGame(){ const S = R.S; S.round = 0; S.used = []; for (const r of S.roster) S.scores[r.id] = 0; S.roster = S.roster.filter(r=>present(r.id)); nextRound(); }
function nextRound(){
  const S = R.S;
  if (S.round >= S.settings.rounds){ S.phase = 'final'; commit(); return; }
  S.round++; S.gains = {}; S.firstSolver = null; S.race = null; S.turn = null; S.item = null;
  if (S.settings.mode === 'elige' && activeIds().length > 1){
    const ids = activeIds(); S.setterId = ids[(S.round-1) % ids.length]; S.phase = 'setting'; S.endsAt = Date.now() + SET_MS; commit();
  } else { S.setterId = null; S.item = pickItem(); beginPlay(); }
}
function beginPlay(){
  const S = R.S, now = Date.now(); S.phase = 'play'; S.startedAt = now;
  if (S.settings.mode === 'turnos'){
    const ids = activeIds(); const k = (S.round-1) % ids.length;
    S.turn = { g:[], miss:0, order: ids.slice(k).concat(ids.slice(0,k)), idx:0, endsAt: now + TURN_MS }; S.endsAt = 0;
  } else {
    S.race = {}; for (const id of activeIds()) if (id !== S.setterId) S.race[id] = { g:[], miss:0, solved:0, out:false };
    S.endsAt = now + DUR[S.settings.kind];
  }
  commit();
}
function turnPlayer(){ const t = R.S.turn; if (!t) return null; for (let i=0;i<t.order.length;i++){ const id = t.order[(t.idx+i) % t.order.length]; if (present(id)){ if(i){ t.idx += i; } return id; } } return null; }
function apply(a, from){
  const S = R.S; if (!S) return;
  if (a.type === 'start' && from === me.id && (S.phase === 'lobby' || S.phase === 'final')){ startGame(); return; }
  if (a.type === 'next' && from === me.id && S.phase === 'roundEnd'){ nextRound(); return; }
  if (a.type === 'skipSet' && S.phase === 'setting' && (from === S.setterId || from === me.id)){ S.item = pickItem(); beginPlay(); return; }
  if (a.type === 'setWord' && S.phase === 'setting' && from === S.setterId){
    const es = String(a.es||'').trim().slice(0,60), en = String(a.en||'').trim().slice(0,60);
    if (!lettersOf(es).size) return; S.item = [es, en || '(sin pista)']; beginPlay(); return;
  }
  if (a.type === 'guess' && S.phase === 'play'){
    const k = String(a.k||'').toLowerCase(); if (!/^[a-zñ]$/.test(k)) return;
    const word = S.item[0], L = lettersOf(word), tries = triesOf(S.settings);
    if (S.settings.mode === 'turnos'){
      const t = S.turn; if (from !== turnPlayer() || t.g.includes(k)) return;
      t.g.push(k);
      if (L.has(k)){ gain(from, 10*occ(word,k), 'letras'); if ([...L].every(c => t.g.includes(c))){ gain(from, 100, 'resuelta'); S.firstSolver = from; endRound(); return; } }
      else { t.miss++; if (t.miss >= tries){ endRound(); return; } }
      t.idx++; t.endsAt = Date.now() + TURN_MS; commit(); return;
    }
    const r = S.race[from]; if (!r || r.solved || r.out || r.g.includes(k)) return;
    r.g.push(k);
    if (L.has(k)){
      gain(from, 10*occ(word,k), 'letras');
      if ([...L].every(c => r.g.includes(c))){
        // first to complete the word wins the round; everyone moves on to the next word
        r.solved = Date.now();
        gain(from, 100, 'resuelta'); gain(from, 50, 'primero');
        S.firstSolver = from;
        if (S.setterId) gain(S.setterId, 30, 'acertaron su palabra');
        endRound(); return;
      }
    } else { r.miss++; if (r.miss >= tries) r.out = true; }
    if (Object.entries(S.race).every(([id,x]) => x.solved || x.out || !present(id))){ endRound(); return; }
    commit();
  }
}
function endRound(){ const S = R.S; S.phase = 'roundEnd'; S.nextAt = Date.now() + NEXT_MS; commit(); }
// host clock: time limits, skipped turns, absent word-setter, auto-advance
setInterval(() => {
  const S = R.S; if (!S || !isHost() || !R.net) return; const now = Date.now();
  if (S.phase === 'play'){
    if (S.settings.mode === 'turnos'){
      const cur = turnPlayer();
      if (!cur){ endRound(); return; }
      if (now > S.turn.endsAt){ S.turn.idx++; S.turn.endsAt = now + TURN_MS; commit(); }
    } else if (now > S.endsAt || Object.entries(S.race).every(([id,x]) => x.solved || x.out || !present(id))) endRound();
  } else if (S.phase === 'setting'){
    if (now > S.endsAt || !present(S.setterId)){ S.item = pickItem(); beginPlay(); }
  } else if (S.phase === 'roundEnd' && now > S.nextAt) nextRound();
}, 500);
// live countdown labels
setInterval(() => { document.querySelectorAll('[data-until]').forEach(el => { const s = Math.max(0, Math.ceil((+el.dataset.until - Date.now())/1000)); el.textContent = el.dataset.fmt === 'clock' ? Math.floor(s/60)+':'+String(s%60).padStart(2,'0') : el.dataset.fmt === 'long' ? longTime(s) : s+' s'; }); }, 250);
function longTime(s){ const d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60); return d ? `${d} d ${h} h` : h ? `${h} h ${m} min` : `${m} min`; }

function playView(){

  let guessed, miss, won = false, lost = false, canPlay, banner = '', feed = '';

// Saved games live in Supabase tables (see setup.sql); ?local uses this browser's storage instead, for testing.
const DB = LOCAL ? (() => {
  const all = t => store.get('ahdb-' + t, []), save = (t, a) => store.set('ahdb-' + t, a);
  const uniq = { results: ['challenge_id','player_id'], daily_results: ['day','group_code','player_id'] };
  return {
    get: async (t, id) => all(t).find(r => r.id === id) || null,
    list: async (t, col, val) => all(t).filter(r => r[col] === val),
    list2: async (t, a, av, b, bv) => all(t).filter(r => r[a] === av && r[b] === bv),
    insert: async (t, row) => { const a = all(t);
      if (row.id != null && a.some(r => r.id === row.id)) throw {code:'23505'};
      if (uniq[t] && a.some(r => uniq[t].every(k => r[k] === row[k]))) throw {code:'23505'};
      row = {...row, id: row.id ?? Date.now() + Math.random(), created_at: new Date().toISOString()}; a.push(row); save(t, a); return row; },
    update: async (t, id, patch) => { const a = all(t), r = a.find(x => x.id === id); if (!r) return null; Object.assign(r, patch); save(t, a); return r; }
  };
})() : (() => {
  const c = () => (supa = supa || window.supabase.createClient(SUPA_URL, SUPA_KEY));
  const q = async p => { const { data, error } = await p; if (error) throw error; return data; };
  return {
    get: (t, id) => q(c().from(t).select('*').eq('id', id).maybeSingle()),
    list: (t, col, val) => q(c().from(t).select('*').eq(col, val).order('created_at', { ascending: true })),
    list2: (t, a, av, b, bv) => q(c().from(t).select('*').eq(a, av).eq(b, bv).order('created_at', { ascending: true })),
    insert: (t, row) => q(c().from(t).insert(row).select().single()),
    update: async (t, id, patch) => (await q(c().from(t).update(patch).eq('id', id).select()))[0] || null
  };
})();
const dbErr = e => { console.error(e); const m = (e && (e.message || e.code)) || '';
  return /42P01|PGRST20|relation|does not exist|schema cache|Could not find the table/i.test(m)
    ? 'Esta parte del juego todavía no tiene su base de datos. Hay que ejecutar setup.sql en Supabase una vez.'
    : 'No se pudo conectar. Revisa tu internet e inténtalo otra vez.'; };

const squares = det => det.map(d => d.s ? '■' : '□').join('');

// Points for one word played on your own: letters, solving, fewer mistakes, and a little for speed
function scoreWord(word, g, miss, tries, ms, solved){
  const L = lettersOf(word); let pts = 0; for (const k of g) if (L.has(k)) pts += 10 * occ(word, k);
  if (solved) pts += 100 + Math.max(0, tries - miss) * 10 + Math.max(0, 50 - Math.floor(ms / 2000));
  return pts;
}
// One word, played alone. o = { item:[es,en,ex?,exEn?], tries, title, sub, label, next, onDone(result), onQuit }
function puzzle(o){
  const st = { g: [], miss: 0, t0: Date.now(), done: false, res: null };
  R.view = 'puzzle';
  const draw = () => {
    const word = o.item[0], L = lettersOf(word), guessed = new Set(st.g);
    const won = [...L].every(c => guessed.has(c)), lost = st.miss >= o.tries;
    let anim = '';
    if (!st.done && (won || lost)){ st.done = true; anim = 'bounce'; const ms = Date.now() - st.t0; st.res = { solved: won, miss: st.miss, ms, pts: scoreWord(word, st.g, st.miss, o.tries, ms, won) }; }
    const mood = won ? 'happy' : (lost || st.miss / o.tries >= .6) ? 'sad' : 'neutral';
    app.innerHTML = `<section class="screen" style="gap:10px">
      <div class="top"><span class="display" style="font-size:24px;letter-spacing:.5px">${o.title}</span>
        <span style="display:flex;align-items:center;gap:8px;font-size:15px;font-variant-numeric:tabular-nums">${o.sub || ''}<button class="ring" data-quit aria-label="Salir" style="width:36px;height:36px">${ICON.back}</button></span></div>
      <div class="stage ${anim}">${hangman(partsFor(st.miss, o.tries, lost), mood, !won, `Ahorcado: ${partsFor(st.miss, o.tries, lost)} de 6 partes dibujadas`)}<span class="remark">${remarkFor(st.miss, o.tries, won, lost)}</span></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:2px;flex:none"><span class="label">${esc(o.label || '')}${o.label ? ' · ' : ''}${Math.max(0, o.tries - st.miss)} intentos</span><span class="clue">“${esc(o.item[1] || '')}”</span></div>
      ${slotsHtml(word, guessed, lost)}
      ${st.done ? `<div style="display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;flex:none">
          <strong style="font-weight:400;font-size:20px">${won ? '¡Lo tienes! +' + st.res.pts + ' pts' : 'Era “' + esc(word) + '”' + (st.res.pts ? ' · +' + st.res.pts + ' pts' : '')}</strong>
          ${o.item[2] ? `<span style="font-size:16px">${esc(o.item[2])}</span><span style="color:var(--muted);font-size:14px">${esc(o.item[3] || '')}</span>` : ''}</div>
          <button class="pill solid" data-next style="margin-top:auto">${o.next || 'Seguir'}</button>`
        : `<span class="feed"></span>${keyboard(word, guessed, true)}`}
    </section>`;
    bind({ '[data-k]': el => { if (st.done) return; const k = el.dataset.k; if (st.g.includes(k)) return; st.g.push(k); if (!L.has(k)) st.miss++; draw(); },
           '[data-next]': () => o.onDone(st.res), '[data-quit]': () => (o.onQuit || goHome)() });
  };
  draw();
}

function playReto(ch){
  const det = [], n = ch.items.length, tries = triesOf(ch.settings); let i = 0;
  const step = () => puzzle({ item: ch.items[i], tries, title: 'RETO ' + fmtCode(ch.id), sub: `${i + 1} / ${n}`,
    label: `${LEVELS[ch.settings.level][0]} · ${kindName(ch.settings.kind)}`, next: i + 1 < n ? 'Siguiente palabra' : 'Ver resultados',
    onQuit: () => openReto(ch.id),
    onDone: async r => {
      det.push({ s: r.solved ? 1 : 0, m: r.miss, p: r.pts }); i++;
      if (i < n){ step(); return; }
      const save = async () => { loading('GUARDANDO…');
        try { await DB.insert('results', { challenge_id: ch.id, player_id: PID, player_name: me.name, face: me.face, score: det.reduce((a, d) => a + d.p, 0), detail: det }); }
        catch (e){ if (e.code !== '23505'){ failView(dbErr(e), save); return; } }
        openReto(ch.id); };
      save();
    } });
  step();
}

function openDuel(id){ R.view = 'duel'; R.duelId = id; R.duelData = null; setURL('duelo=' + id); render(); }
async function duelView(){
  const id = R.duelId; if (!R.duelData) loading();

    let d = await DB.get('duels', id);

    const turns = (await DB.list('duel_turns', 'duel_id', id)).sort((x, y) => (x.created_at < y.created_at ? -1 : 1));
    if (R.view !== 'duel' || R.duelId !== id) return;

  } catch (e){ failView(dbErr(e), () => render()); }

function drawDuel(d, turns){
  const amA = d.a_id === PID, amB = d.b_id === PID, inDuel = amA || amB;
  const other = amA ? (d.b_name || 'tu amigo') : d.a_name;
  const pts = id => turns.filter(t => t.solver_id === id).reduce((a, t) => a + (t.pts || 0), 0);
  const last = turns[turns.length - 1], url = SITE + '?duelo=' + d.id;
  let action = '';
  if (!inDuel) action = `<div class="note"><p>Este duelo es entre ${esc(d.a_name)} y ${esc(d.b_name)}. Crea el tuyo desde el inicio.</p></div>`;
  else if (last && !last.answered_at){
    action = last.setter_id === PID
      ? `<div class="note"><span class="label">Esperando</span><p>Le pusiste <b>“${esc(last.es)}”</b> a ${esc(other)}. Cuando la adivine, te tocará a ti.</p>${d.b_id ? '' : '<p style="color:var(--muted)">Mándale el enlace para que empiece.</p>'}</div>`
      : `<div class="note"><span class="label">Te toca adivinar</span><p>${esc(last.setter_name)} te puso una palabra. Pista: <b>“${esc(last.en)}”</b></p></div><button class="pill solid" data-guess style="margin-top:auto">Adivinar</button>`;
  } else {
    const nextSetter = last ? last.solver_id : d.a_id;
    action = nextSetter === PID
      ? `<div class="note"><span class="label">Te toca poner una palabra</span><p>Escríbele una palabra o frase a ${esc(other)}.</p></div><button class="pill solid" data-write style="margin-top:auto">Poner una palabra</button>`
      : `<div class="note"><span class="label">Esperando</span><p>${esc(other)} te está buscando una palabra.</p></div>`;
  }
  const hist = turns.slice().reverse().map(t => {
    const hidden = !t.answered_at && t.setter_id !== PID;
    const solver = t.solver_name || (t.setter_id === d.a_id ? (d.b_name || '…') : d.a_name);
    return `<div class="r"><div class="who"><b>${t.setter_id === PID ? 'Tú' : esc(t.setter_name)} → ${t.solver_id === PID || (!t.solver_id && t.setter_id !== PID) ? 'tú' : esc(solver)}</b>
      <span>${hidden ? 'Palabra secreta · por adivinar' : `“${esc(t.es)}” · ${esc(t.en)}`}</span></div>
      <span class="tag ${t.answered_at && t.solved ? 'on' : 'off'}">${!t.answered_at ? 'Pendiente' : t.solved ? '+' + t.pts : 'No salió' + (t.pts ? ' +' + t.pts : '')}</span></div>`;
  }).join('');
  app.innerHTML = `<section class="screen">
    <div class="top">${backBtn('Volver al inicio')}<span class="label">Duelo ${esc(fmtCode(d.id))}</span><span style="width:44px"></span></div>
    <div class="vs"><div class="p">${avatar(d.a_face, 'happy')}<span>${amA ? 'Tú' : esc(d.a_name)}</span><b>${pts(d.a_id)}</b></div>
      <span class="hand" style="font-size:30px">VS</span>
      <div class="p">${d.b_id ? avatar(d.b_face, 'happy') : `<div style="width:68px;height:68px;border-radius:50%;border:1.5px dashed var(--line)"></div>`}<span>${amB ? 'Tú' : d.b_id ? esc(d.b_name) : 'Esperando…'}</span><b>${d.b_id ? pts(d.b_id) : '—'}</b></div></div>
    ${shareRow()}
    ${action}
    ${hist ? `<div class="rows hist"><div class="label" style="padding-bottom:6px">Historial</div>${hist}</div>` : ''}
  </section>`;
  bindShare(url, `Te reto a un duelo de ahorcado en español: ${fmtCode(d.id)}`);
  bind({ '[data-back]': goHome,
    '[data-guess]': () => puzzle({ item: [last.es, last.en], tries: wordTries(last.es), title: 'DUELO', sub: 'Palabra de ' + esc(last.setter_name), label: 'Duelo', next: 'Guardar',
      onQuit: () => openDuel(d.id),
      onDone: async r => { loading('GUARDANDO…');
        try { await DB.update('duel_turns', last.id, { solver_id: PID, solver_name: me.name, solved: r.solved, miss: r.miss, pts: r.pts, answered_at: new Date().toISOString() }); }
        catch (e){ failView(dbErr(e), () => openDuel(d.id)); return; }
        R.duelWrite = true; openDuel(d.id); } }),
    '[data-write]': () => writeDuelWord(d) });
  if (R.duelWrite && action.includes('data-write')){ R.duelWrite = false; writeDuelWord(d); }
}
function writeDuelWord(d){

/* ---------- Palabra del día: one word a day, scored within your group ---------- */
let GROUP = store.get('ahorcado-group', null);
const dayKey = (t = new Date()) => `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function dailyItem(day){
  const pool = [...BANK.palabra[0], ...BANK.palabra[1], ...BANK.varias[0], ...BANK.varias[1], ...BANK.frase[0], ...BANK.palabra[2], ...BANK.varias[2]];
  let h = 2166136261; for (const c of 'ahorcado' + day){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; }
  return pool[h % pool.length];
}
const dailyHist = () => store.get('ahorcado-daily-' + PID, {});
const playedToday = () => !!dailyHist()[dayKey()];
function streak(){ const h = dailyHist(); let n = 0, t = new Date(); if (!h[dayKey(t)]) t.setDate(t.getDate() - 1);
  while (h[dayKey(t)] && h[dayKey(t)].solved){ n++; t.setDate(t.getDate() - 1); } return n; }
function joinGroup(c){ if (c !== GROUP){ GROUP = c; store.set('ahorcado-group', GROUP); setTimeout(() => toast('Estás en el grupo ' + fmtCode(GROUP)), 300); } openDaily(); }
function openDaily(){ if (!GROUP){ GROUP = asyncCode(); store.set('ahorcado-group', GROUP); } R.view = 'daily'; R.dailyData = null; setURL('grupo=' + GROUP); render(); }
async function dailyView(){
  const day = dayKey(); if (!R.dailyData) loading();
  try {
    const res = await DB.list2('daily_results', 'day', day, 'group_code', GROUP);
    if (R.view !== 'daily') return;
    R.dailyData = res; drawDaily(day, res);
  } catch (e){ failView(dbErr(e), () => render()); }
}
function drawDaily(day, res){
  const [y, m, dd] = day.split('-').map(Number), item = dailyItem(day), hist = dailyHist();
  const mine = hist[day] || (() => { const r = res.find(x => x.player_id === PID); return r && { solved: r.solved, pts: r.score, miss: r.miss }; })();
  const rows = res.slice().sort((a, b) => b.score - a.score);
  const tomorrow = new Date(y, m - 1, dd + 1).getTime(), url = SITE + '?grupo=' + GROUP;
  const myText = mine ? `AHORCADO · Palabra del día ${dd} ${MONTHS[m - 1]}\n${mine.solved ? '■' : '□'} ${mine.miss} ${mine.miss === 1 ? 'fallo' : 'fallos'} · ${mine.pts} pts · racha ${streak()}\n${url}` : '';
  app.innerHTML = `<section class="screen">
    <div class="top">${backBtn('Volver al inicio')}<span class="label">${dd} de ${MONTHS[m - 1]}</span><span style="width:44px"></span></div>
    <h2 class="display" style="font-size:60px">LA PALABRA<br>DEL DÍA</h2>
    <div class="tags" style="justify-content:flex-start"><span>Racha: ${streak()} ${streak() === 1 ? 'día' : 'días'}</span><span>Grupo ${esc(fmtCode(GROUP))}</span><span>${res.length} ${res.length === 1 ? 'ha jugado' : 'han jugado'} hoy</span></div>
    ${mine ? `<div class="note"><span class="label">Tu resultado de hoy</span><p style="font-size:24px;font-weight:300">${esc(item[0])} <span style="font-size:15px;color:var(--muted)">· ${esc(item[1])}</span></p>
        <p>${mine.solved ? '¡Resuelta!' : 'No salió.'} ${mine.miss} ${mine.miss === 1 ? 'fallo' : 'fallos'} · <b>${mine.pts} pts</b></p>
        <p style="color:var(--muted)">Nueva palabra en <span data-until="${tomorrow}" data-fmt="long">${longTime((tomorrow - Date.now()) / 1000)}</span></p></div>`
      : `<p style="margin:0;color:var(--muted);line-height:1.45">Una palabra al día, la misma para todo tu grupo. Tienes un solo intento.</p>`}
    <div class="rows lb"><div class="label" style="padding-bottom:6px">Hoy en tu grupo</div>
      ${rows.length ? rows.map((r, i) => `<div class="r"><span class="rk">${i + 1}</span>${avatar(r.face, r.solved ? 'happy' : 'sad')}<div class="who"><b>${r.player_id === PID ? 'Tú' : esc(r.player_name)}</b><span>${r.solved ? 'Resuelta' : 'No salió'} · ${r.miss} ${r.miss === 1 ? 'fallo' : 'fallos'}</span></div><span class="tot">${r.score}</span></div>`).join('')
        : `<div class="r"><div class="who"><b>Nadie ha jugado hoy todavía</b><span>Invita a tu grupo con el enlace.</span></div></div>`}</div>
    <span class="label" style="text-align:center">Invita a tu grupo</span>${shareRow()}
    <div style="margin-top:auto;display:flex;flex-direction:column;gap:10px">
      ${mine ? `<button class="pill solid" data-share-res>Compartir mi resultado</button>` : `<button class="pill solid" data-play>Jugar la de hoy</button>`}</div></section>`;
  bindShare(url, `Juega conmigo la palabra del día en español. Grupo ${fmtCode(GROUP)}`);
  bind({ '[data-back]': goHome,
    '[data-share-res]': () => navigator.share ? navigator.share({ title: 'Ahorcado', text: myText }).catch(() => {}) : copyText(myText, 'Resultado copiado'),
    '[data-play]': () => puzzle({ item, tries: wordTries(item[0]), title: 'PALABRA DEL DÍA', sub: `${dd} ${MONTHS[m - 1].slice(0, 3)}`, label: 'Un solo intento', next: 'Ver el grupo',
      onQuit: () => openDaily(),
      onDone: async r => {
        const h = dailyHist(); h[day] = { solved: r.solved, pts: r.pts, miss: r.miss }; store.set('ahorcado-daily-' + PID, h);
        loading('GUARDANDO…');
        try { await DB.insert('daily_results', { day, group_code: GROUP, player_id: PID, player_name: me.name, face: me.face, score: r.pts, solved: r.solved, miss: r.miss }); }
        catch (e){ if (e.code !== '23505'){ failView(dbErr(e), () => openDaily()); return; } }
        openDaily(); } }) });
}

// keep leaderboards fresh while they are on screen (never while someone is typing)
setInterval(() => {
  if (document.visibilityState !== 'visible' || app.querySelector('input')) return;
  if (R.view === 'reto' && R.retoData) retoView(); else if (R.view === 'duel' && R.duelData) duelView(); else if (R.view === 'daily' && R.dailyData) dailyView();
}, 15000);

/* ===================== boot ===================== */
const startCode = normCode(params.get('sala')), linkReto = normCode(params.get('reto')), linkDuel = normCode(params.get('duelo')), linkGroup = normCode(params.get('grupo'));
const linkCode = linkReto || linkDuel || linkGroup || startCode;
function followLink(){
  if (linkReto) needName(() => openReto(linkReto));
  else if (linkDuel) needName(() => openDuel(linkDuel));
  else if (linkGroup) needName(() => joinGroup(linkGroup));
  else if (startCode){ R.pendingJoin = startCode; needName(() => { R.view = 'join'; render(); }); }
  else { R.view = 'home'; render(); }
  if (!['reto', 'duel', 'daily'].includes(R.view)) render();
}
// An invite opened in iPhone Safari: offer to install first. Safari and the home-screen app keep separate
// memories on iPhone, so joining here and installing later would leave the game behind in Safari.
if (linkCode && IOS && canInstall() && !sess.get('ahorcado-safari')){ R.installCode = linkCode; R.afterInstall = followLink; R.view = 'install'; render(); }
else followLink();
addEventListener('pagehide', () => { if (R.net) R.net.leave(); });

// Offline shell: the game opens instantly and practice works without signal
if ('serviceWorker' in navigator && !LOCAL && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
